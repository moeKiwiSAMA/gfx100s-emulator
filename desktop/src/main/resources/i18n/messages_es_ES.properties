firmware.guide.intro=El firmware propietario de FUJIFILM no se incluye en las distribuciones públicas o de código fuente. Proporcione el firmware oficial FUJIFILM GFX100S Ver. 2.13 (GXUP0004.DAT) para iniciar la cámara.
firmware.guide.steps=1. Descargue el firmware oficial FUJIFILM GFX100S Ver. 2.13 (GXUP0004.DAT) desde la página de soporte de Fujifilm que aparece abajo.\n2. Pulse «Seleccionar GXUP0004.DAT...» para verificar su suma SHA-256 e importarlo automáticamente (o coloque GXUP0004.DAT en flash/ o runtime/firmware/ y vuelva a iniciar).\n3. Una vez importado, el emulador inicializa flash/nor-flash.bin e inicia directamente la cámara.
