firmware.guide.intro=公開ビルドおよびソース配布物には富士フイルム製の専用ファームウェアは同梱されていません。カメラを起動するには公式 FUJIFILM GFX100S ファームウェア Ver. 2.13 (GXUP0004.DAT) をご用意ください。
firmware.guide.steps=1. 下の富士フイルム公式サポートページから GFX100S ファームウェア Ver. 2.13 (GXUP0004.DAT) をダウンロードします。\n2. 「GXUP0004.DAT を選択...」をクリックして SHA-256 を検証・自動インポートします（または flash/ もしくは runtime/firmware/ に配置して再起動します）。\n3. インポート完了後、flash/nor-flash.bin が自動初期化されカメラが起動します。
