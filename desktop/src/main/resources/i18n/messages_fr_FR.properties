firmware.guide.intro=Le firmware propriétaire FUJIFILM n'est pas inclus dans les distributions publiques ou sources. Veuillez fournir le firmware officiel FUJIFILM GFX100S Ver. 2.13 (GXUP0004.DAT) pour démarrer l'appareil.
firmware.guide.steps=1. Téléchargez le firmware officiel FUJIFILM GFX100S Ver. 2.13 (GXUP0004.DAT) depuis la page d'assistance Fujifilm ci-dessous.\n2. Cliquez sur « Sélectionner GXUP0004.DAT... » pour vérifier l'empreinte SHA-256 et l'importer automatiquement (ou placez GXUP0004.DAT dans flash/ ou runtime/firmware/ puis relancez).\n3. Une fois importé, l'émulateur initialise flash/nor-flash.bin et démarre directement l'appareil.
