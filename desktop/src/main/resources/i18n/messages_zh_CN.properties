firmware.guide.intro=公开版与源码发行包不包含富士专有相机固件二进制文件。请提供官方 FUJIFILM GFX100S 2.13 版固件 (GXUP0004.DAT) 以启动相机。
firmware.guide.steps=1. 从下方富士胶片官方支持页面下载 FUJIFILM GFX100S 固件 Ver. 2.13 (GXUP0004.DAT)。\n2. 点击下方“选择 GXUP0004.DAT...”按钮自动校验 SHA-256 并导入（或将 GXUP0004.DAT 放入 flash/ 或 runtime/firmware/ 目录后重新启动）。\n3. 导入完成后，模拟器将自动初始化 flash/nor-flash.bin 并直接开机进入相机界面。
