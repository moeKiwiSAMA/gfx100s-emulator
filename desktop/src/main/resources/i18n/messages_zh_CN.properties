theme.ui.vintage_brass.desc=暖调深炭黑蒙皮质感搭配古董拉丝黄铜（#D4A259）点缀。
theme.ui.olive_field.desc=哑光野战仪器橄榄绿配色搭配暖沙金（#C9B37E）刻度读数。
