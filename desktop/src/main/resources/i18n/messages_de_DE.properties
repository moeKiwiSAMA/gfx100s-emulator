firmware.guide.intro=Proprietäre FUJIFILM-Kamera-Firmware ist nicht in öffentlichen oder quelloffenen Paketen enthalten. Bitte stellen Sie die offizielle FUJIFILM GFX100S Firmware Ver. 2.13 (GXUP0004.DAT) bereit, um die Kamera zu starten.
firmware.guide.steps=1. Laden Sie die offizielle FUJIFILM GFX100S Firmware Ver. 2.13 (GXUP0004.DAT) von der unten stehenden Fujifilm-Supportseite herunter.\n2. Klicken Sie auf „GXUP0004.DAT auswählen...“, um die SHA-256-Prüfsumme zu verifizieren und automatisch zu importieren (oder legen Sie GXUP0004.DAT in flash/ bzw. runtime/firmware/ ab und starten Sie neu).\n3. Nach dem Import initialisiert der Emulator flash/nor-flash.bin und startet direkt in die Kamera.
