<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUJIFILM GFX100S Emulator HTTP Control API</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface-2: #1c222b;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --get: #2ea043;
  --post: #1f6feb;
  --patch: #d29922;
  --err: #f85149;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.5;
}
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(13, 17, 23, 0.95);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(8px);
  padding: 14px 20px;
}
.header-inner {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.brand h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.2px;
}
.brand .sub {
  font-size: 12px;
  color: var(--muted);
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
input[type="text"], textarea {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 13px;
  font-family: var(--mono);
}
input[type="text"]:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
}
#search { width: 240px; font-family: var(--sans); }
#baseUrl { width: 220px; }
button {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 7px 11px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
button:hover { border-color: var(--accent); color: #fff; }
button.primary {
  background: var(--post);
  border-color: var(--post);
  color: #fff;
}
button.primary:hover { filter: brightness(1.12); }
main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 20px 64px;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.tag-btn {
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12px;
  background: var(--surface);
}
.tag-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #0d1117;
}
.stats {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 14px;
}
.group-title {
  margin: 24px 0 6px;
  font-size: 16px;
  font-weight: 700;
}
.group-desc {
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--muted);
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 10px;
  overflow: hidden;
}
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  cursor: pointer;
  user-select: none;
}
.card-head:hover { background: var(--surface-2); }
.badge {
  display: inline-block;
  min-width: 58px;
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  padding: 3px 7px;
  border-radius: 4px;
  color: #fff;
}
.badge.GET { background: var(--get); }
.badge.POST { background: var(--post); }
.badge.PATCH { background: var(--patch); color: #0d1117; }
.ep-path {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
}
.ep-summary {
  color: var(--muted);
  font-size: 13px;
  margin-left: auto;
  text-align: right;
}
.card-body {
  display: none;
  border-top: 1px solid var(--border);
  padding: 14px 16px 16px;
  background: #11161d;
}
.card.open .card-body { display: block; }
.ep-desc {
  margin: 0 0 12px;
  font-size: 13px;
  color: #c9d1d9;
}
.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--muted);
  margin: 14px 0 6px;
  font-weight: 700;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-bottom: 10px;
}
th, td {
  text-align: left;
  border-bottom: 1px solid var(--border);
  padding: 6px 8px;
  vertical-align: top;
}
th { color: var(--muted); font-weight: 600; }
code {
  font-family: var(--mono);
  font-size: 12px;
  background: rgba(110, 118, 129, 0.2);
  padding: 1px 4px;
  border-radius: 4px;
}
pre {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 12px;
  margin: 6px 0 10px;
}
.try-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  margin-top: 10px;
}
.try-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.try-row label {
  font-size: 12px;
  color: var(--muted);
  font-family: var(--mono);
}
.try-body {
  width: 100%;
  min-height: 84px;
  resize: vertical;
  margin-bottom: 8px;
}
.try-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.status-pill {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}
.status-ok { background: rgba(46, 160, 67, 0.2); color: #3fb950; }
.status-err { background: rgba(248, 81, 73, 0.2); color: var(--err); }
.hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <h1>FUJIFILM GFX100S Emulator HTTP Control API</h1>
      <div class="sub">OpenAPI 3.1.0 &middot; Offline Interactive Explorer &middot; Loopback 127.0.0.1</div>
    </div>
    <div class="controls">
      <input id="baseUrl" type="text" title="ControlServer Base URL" placeholder="http://127.0.0.1:18080">
      <input id="search" type="text" placeholder="Search path, tag, field...">
      <button id="expandAll" type="button">Expand All</button>
      <button id="collapseAll" type="button">Collapse All</button>
    </div>
  </div>
</header>
<main>
  <div id="tags" class="tags"></div>
  <div id="stats" class="stats"></div>
  <div id="list"></div>
</main>
<script id="api-spec-data" type="application/json">{"title":"FUJIFILM GFX100S Emulator HTTP Control API","version":"1.0.0","openapi":"3.1.0","defaultBaseUrl":"http://127.0.0.1:18080","tags":[{"name":"Core & Catalog","description":"Live emulator state snapshots, component patching, memory dumps, and hardware address dictionary queries."},{"name":"Profiler","description":"Asynchronous CPU/instruction profiler start, stop, and JSON or plain-text reports."},{"name":"Touch & Controls","description":"Rear LCD touch taps/swipes, EVF eye sensor, ADC buttons/dials, focus mode, shooting mode, and VIEW MODE."},{"name":"Optics & Filters","description":"Mounted lens control, multi-slot optical filter rack (UV, ND, Bokeh Mask, Star, Mist, GND), and ND shorthand."},{"name":"Audio","description":"Host audio output/input mixer, device enumeration, headphone/mic jack simulation, and loopback monitoring."},{"name":"Wireless","description":"BCM43438 Wi-Fi / BLE combo radio status and virtual mobile peer / PTP-IP bridge controls."},{"name":"Power & Battery","description":"NP-W235 battery pack state-of-charge, pack voltage, USB-C VBUS external power, and charging controls."},{"name":"Telemetry","description":"Manual diagnostic session log upload."},{"name":"UI & Personalization","description":"Runtime UI locale switching and camera body / studio theme customization."},{"name":"NOR Flash","description":"Unified 64 MiB QSPI NOR Flash status inspection, .DAT firmware flashing, raw export/import, and factory restore."},{"name":"Documentation","description":"Self-hosted OpenAPI 3.1.0 specification and offline interactive HTML API explorer."}],"endpoints":[{"operationId":"getCatalog","method":"GET","path":"/api/v1/catalog","tag":"Core & Catalog","summary":"Query hardware address catalog","description":"Queries the bundled GFX100S 2.13 MMIO/memory address dictionary using up to 16 distinct query parameters.","params":[{"name":"address","location":"query","type":"string","required":false,"description":"Hex or decimal MMIO/memory address to look up (e.g. `0xfff40000`).","example":"0xfff40000"},{"name":"subsystem","location":"query","type":"string","required":false,"description":"Optional subsystem filter (e.g. `isp`, `dma`, `gpio`).","example":"isp"},{"name":"query","location":"query","type":"string","required":false,"description":"Optional free-text search term across device/region names and notes.","example":"RECC_S"}],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"Matching address catalog entries."},{"status":400,"contentType":"application/json","description":"Duplicate, malformed, or excessive (>16) query parameters."},{"status":500,"contentType":"application/json","description":"Address dictionary unavailable."}],"successExampleJson":"{\n  \"count\" : 1,\n  \"entries\" : [ {\n    \"name\" : \"soc-isp.core\",\n    \"start\" : \"0xfff70000\",\n    \"end\" : \"0xfff702ec\",\n    \"basis\" : \"DAT\"\n  } ]\n}"},{"operationId":"getState","method":"GET","path":"/api/v1/state","tag":"Core & Catalog","summary":"Get live emulator and component state snapshot","description":"Returns the complete component roster (id, revision, config, state) merged with the live `machine` execution telemetry map.","params":[],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"Current component snapshot and machine telemetry."}],"successExampleJson":"{\n  \"components\" : [ {\n    \"id\" : \"buttons\",\n    \"revision\" : 1,\n    \"config\" : {\n      \"power\" : true,\n      \"movieMode\" : false\n    },\n    \"state\" : {\n      \"power\" : true,\n      \"movieMode\" : false\n    }\n  } ],\n  \"machine\" : {\n    \"status\" : \"running\",\n    \"tick\" : 125000000,\n    \"screenId\" : \"0x0100\"\n  }\n}"},{"operationId":"createDump","method":"POST","path":"/api/v1/dump","tag":"Core & Catalog","summary":"Trigger a memory and state dump","description":"Captures an emulator state/memory dump archive via the runtime dump handler. Body must be empty or `{}`.","params":[],"requestContentType":"application/json","requestFields":[],"requestExampleJson":"{ }","responses":[{"status":201,"contentType":"application/json","description":"Dump created successfully."},{"status":400,"contentType":"application/json","description":"Non-empty JSON object or missing `application/json` Content-Type."},{"status":500,"contentType":"application/json","description":"Dump handler unavailable."}],"successExampleJson":"{\n  \"dump\" : \"dumps/dump-20261125-120000\"\n}"},{"operationId":"patchComponent","method":"PATCH","path":"/api/v1/components/{id}","tag":"Core & Catalog","summary":"Patch live settings of a hardware component","description":"Applies a live settings patch to component `{id}` with optimistic concurrency control using its current `revision` from `GET /api/v1/state`.","params":[{"name":"id","location":"path","type":"string","required":true,"description":"Component identifier matching `[a-z][a-z0-9-]{0,63}` (e.g. `buttons`, `cmos`, `soc-adc`).","example":"buttons"}],"requestContentType":"application/json","requestFields":[{"name":"revision","type":"integer","required":true,"description":"Expected non-negative component revision."},{"name":"changes","type":"object","required":true,"description":"Key-value map of live component settings to update."}],"requestExampleJson":"{\n  \"revision\" : 1,\n  \"changes\" : {\n    \"menu\" : true\n  }\n}","responses":[{"status":200,"contentType":"application/json","description":"Updated component descriptor with incremented revision."},{"status":400,"contentType":"application/json","description":"Malformed payload, invalid setting key/value, or wrong Content-Type."},{"status":409,"contentType":"application/json","description":"Revision mismatch (stale revision)."}],"successExampleJson":"{\n  \"id\" : \"buttons\",\n  \"revision\" : 2,\n  \"state\" : {\n    \"menu\" : true\n  }\n}"},{"operationId":"startProfiler","method":"POST","path":"/api/profiler/start","tag":"Profiler","summary":"Start asynchronous performance profiler","description":"Starts sampling CPU/PC hot spots and subsystem timings. `intervalMs` may be provided as a query parameter or JSON body field (body overrides query).","params":[{"name":"intervalMs","location":"query","type":"integer","required":false,"description":"Sampling interval in milliseconds (defaults to profiler default).","example":"5"}],"requestContentType":"application/json","requestFields":[{"name":"intervalMs","type":"integer","required":false,"description":"Optional sampling interval in milliseconds."}],"requestExampleJson":"{\n  \"intervalMs\" : 5\n}","responses":[{"status":200,"contentType":"application/json","description":"Profiler started."},{"status":400,"contentType":"application/json","description":"Invalid `intervalMs` or non-JSON body."},{"status":404,"contentType":"application/json","description":"Profiler not attached to this session."}],"successExampleJson":"{\n  \"running\" : true,\n  \"intervalMs\" : 5\n}"},{"operationId":"stopProfiler","method":"POST","path":"/api/profiler/stop","tag":"Profiler","summary":"Stop profiler and fetch report","description":"Stops active profiling and returns the collected report as JSON, or as `text/plain` when `?format=text|txt` or `Accept: text/plain` is sent.","params":[{"name":"format","location":"query","type":"string","required":false,"description":"Response format override (`json`, `text`, or `txt`).","example":"json"}],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"Profiler stopped with summary report (JSON or plain text)."},{"status":404,"contentType":"application/json","description":"Profiler not attached to this session."}],"successExampleJson":"{\n  \"running\" : false,\n  \"samples\" : 1240,\n  \"elapsedMs\" : 6200\n}"},{"operationId":"getProfilerReport","method":"GET","path":"/api/profiler/report","tag":"Profiler","summary":"Read latest profiler report","description":"Returns the current or last completed profiler report without stopping a running session. Supports `text/plain` via `?format=text|txt` or `Accept: text/plain`.","params":[{"name":"format","location":"query","type":"string","required":false,"description":"Response format override (`json`, `text`, or `txt`).","example":"json"}],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"Latest profiler report."},{"status":404,"contentType":"application/json","description":"Profiler not attached to this session."}],"successExampleJson":"{\n  \"running\" : true,\n  \"samples\" : 610,\n  \"elapsedMs\" : 3050\n}"},{"operationId":"postTouch","method":"POST","path":"/api/touch","tag":"Touch & Controls","summary":"Send a rear-LCD touch event","description":"Injects a single capacitive touch down/move/up event onto the rear LCD (`rear-touch-ic` preferred, falling back to `i2c-bus`). Payload must contain exact keys `x`, `y`, `pressed`.","params":[],"requestContentType":"application/json","requestFields":[{"name":"x","type":"integer","required":true,"description":"Horizontal touch coordinate (`0..65535`; rear LCD native range `0..1023`)."},{"name":"y","type":"integer","required":true,"description":"Vertical touch coordinate (`0..65535`; rear LCD native range `0..767`)."},{"name":"pressed","type":"boolean","required":true,"description":"`true` for finger down/move, `false` for finger release."}],"requestExampleJson":"{\n  \"x\" : 512,\n  \"y\" : 384,\n  \"pressed\" : true\n}","responses":[{"status":200,"contentType":"application/json","description":"Touch event applied."},{"status":400,"contentType":"application/json","description":"Missing/extra keys or out-of-range coordinates."},{"status":404,"contentType":"application/json","description":"No touch controller component available."}],"successExampleJson":"{\n  \"ok\" : true,\n  \"component\" : \"rear-touch-ic\",\n  \"x\" : 512,\n  \"y\" : 384,\n  \"pressed\" : true,\n  \"revision\" : 4\n}"},{"operationId":"postTouchSwipe","method":"POST","path":"/api/touch/swipe","tag":"Touch & Controls","summary":"Send a multi-step rear-LCD touch swipe/flick","description":"Executes a calibrated multi-step capacitive swipe gesture. Provide either a cardinal `direction` (`up`/`down`/`left`/`right`) OR explicit `x1`/`y1`/`x2`/`y2` endpoints (never both). Default `4` steps x `20 ms` satisfies both LiveView T-Fn flicks (<260 ms) and Playback slide-commit (>341 px).","params":[],"requestContentType":"application/json","requestFields":[{"name":"direction","type":"string","required":false,"description":"Preset swipe direction (mutually exclusive with `x1`/`y1`/`x2`/`y2`)."},{"name":"x1","type":"integer","required":false,"description":"Start X coordinate (`0..65535`). Required when `direction` is omitted."},{"name":"y1","type":"integer","required":false,"description":"Start Y coordinate (`0..65535`). Required when `direction` is omitted."},{"name":"x2","type":"integer","required":false,"description":"End X coordinate (`0..65535`). Required when `direction` is omitted."},{"name":"y2","type":"integer","required":false,"description":"End Y coordinate (`0..65535`). Required when `direction` is omitted."},{"name":"steps","type":"integer","required":false,"description":"Number of intermediate move steps (`1..8`, default `4`)."},{"name":"stepMs","type":"integer","required":false,"description":"Per-step dwell in milliseconds (`5..100`, default `20`)."}],"requestExampleJson":"{\n  \"direction\" : \"left\",\n  \"steps\" : 4,\n  \"stepMs\" : 20\n}","responses":[{"status":200,"contentType":"application/json","description":"Swipe gesture completed."},{"status":400,"contentType":"application/json","description":"Invalid direction, mixed direction+coordinates, or out-of-range steps/stepMs."},{"status":404,"contentType":"application/json","description":"No touch controller component available."}],"successExampleJson":"{\n  \"ok\" : true,\n  \"component\" : \"rear-touch-ic\",\n  \"direction\" : \"left\",\n  \"x1\" : 760,\n  \"y1\" : 384,\n  \"x2\" : 240,\n  \"y2\" : 384,\n  \"steps\" : 4,\n  \"stepMs\" : 20,\n  \"revision\" : 10\n}"},{"operationId":"getEyeSensor","method":"GET","path":"/api/eye-sensor","tag":"Touch & Controls","summary":"Get EVF eye proximity sensor state","description":"Inspects the TMD2772 (or `i2c-bus` fallback) eye proximity state along with active viewfinder detection (`LCD`, `EVF`, `BOTH`, or `WAITING`) and display frame sequences.","params":[],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"Current eye sensor and viewfinder routing state."},{"status":404,"contentType":"application/json","description":"Eye sensor component unavailable."}],"successExampleJson":"{\n  \"ok\" : true,\n  \"component\" : \"tmd2772\",\n  \"near\" : false,\n  \"activeViewfinder\" : \"LCD\",\n  \"lcdSequence\" : 42,\n  \"evfSequence\" : 0,\n  \"lcdOutputActive\" : true,\n  \"evfOutputActive\" : false\n}"},{"operationId":"postEyeSensor","method":"POST","path":"/api/eye-sensor","tag":"Touch & Controls","summary":"Set EVF eye proximity sensor","description":"Sets whether an eye is detected near the EVF (`near: true` switches automatic viewfinder routing to EVF; `false` returns to rear LCD).","params":[],"requestContentType":"application/json","requestFields":[{"name":"near","type":"boolean","required":true,"description":"`true` for eye close to EVF, `false` for eye away."}],"requestExampleJson":"{\n  \"near\" : true\n}","responses":[{"status":200,"contentType":"application/json","description":"Eye sensor updated."},{"status":400,"contentType":"application/json","description":"Payload missing exact `near` boolean key."},{"status":404,"contentType":"ap using `clear`/`off`, an ordered `slots` array (up to 4 stacked filters), flat settings (`ndPreset`, `ndStops`, `uvPreset`, `bokehMask`, `star*`, `mist*`, `gnd*`), or nested shorthand objects (`uv`, `nd`, `bokeh`, `star`, `mist`, `gnd`).","params":[],"requestContentType":"application/json","requestFields":[{"name":"clear","type":"boolean","required":false,"description":"Reset all filter slots and stages to OFF."},{"name":"off","type":"boolean","required":false,"description":"Alias for `clear`."},{"name":"enabled","type":"boolean","required":false,"description":"Master optical filter bypass switch."},{"name":"slots","type":"array","required":false,"description":"Ordered multi-slot rack array (max 4 filter objects with `type`) or encoded string."},{"name":"ndPreset","type":"string","required":false,"description":"ND preset ID (`OFF`, `ND2`, `ND4`, `ND8`, `ND16`, `ND32`, `ND64`, `ND1000`, `VND`)."},{"name":"ndStops","type":"number","required":false,"description":"ND attenuation in EV stops (`0.0..10.0`)."},{"name":"uvPreset","type":"string","required":false,"description":"UV protector preset (`OFF`, `MULTI_COATED`, `UNCOATED`, `WARMING`, `HAZE`, `CUSTOM`)."},{"name":"bokehMask","type":"string","required":false,"description":"Custom aperture bokeh mask shape (`OFF`, `HEART`, `STAR`, `HEXAGON`, `CAT_EYE`, `ANAMORPHIC`)."},{"name":"starEnabled","type":"boolean","required":false,"description":"Enable diffraction star filter."},{"name":"mistEnabled","type":"boolean","required":false,"description":"Enable black mist / diffusion glow filter."},{"name":"gndEnabled","type":"boolean","required":false,"description":"Enable graduated neutral-density filter."},{"name":"uv","type":"object","required":false,"description":"Nested UV shorthand object (`preset`, `transmittance`, `veilingGlare`, `ghostIntensity`, `softness`, `tintR/G/B`) or preset string."},{"name":"nd","type":"object","required":false,"description":"Nested ND shorthand object (`preset`, `stops`)."},{"name":"bokeh","type":"object","required":false,"description":"Nested bokeh shorthand object (`shape`/`mask`, `angleDeg`, `scale`)."},{"name":"star","type":"object","required":false,"description":"Nested star shorthand object (`enabled`, `points`, `strength`, `threshold`, `angleDeg`, `length`)."},{"name":"mist","type":"object","required":false,"description":"Nested mist shorthand object (`enabled`, `preset`, `strength`, `threshold`)."},{"name":"gnd","type":"object","required":false,"description":"Nested GND shorthand object (`enabled`, `stops`, `horizon`, `feather`, `angleDeg`)."}],"requestExampleJson":"{\n  \"enabled\" : true,\n  \"nd\" : {\n    \"preset\" : \"ND8\"\n  },\n  \"mist\" : {\n    \"enabled\" : true,\n    \"strength\" : 0.35\n  }\n}","responses":[{"status":200,"contentType":"application/json","description":"Updated optical filter stack state."},{"status":400,"contentType":"application/json","description":"No valid filter setting or unknown preset/shape."},{"status":404,"contentType":"application/json","description":"`optical-filter` component unavailable."}],"successExampleJson":"{\n  \"ok\" : true,\n  \"component\" : \"optical-filter\",\n  \"revision\" : 2,\n  \"enabled\" : true,\n  \"ndPreset\" : \"ND8\",\n  \"ndStops\" : 3.0,\n  \"mistEnabled\" : true,\n  \"mistStrength\" : 0.35\n}"},{"operationId":"getNdFilter","method":"GET","path":"/api/nd","tag":"Optics & Filters","summary":"Get ND filter transmittance and stop metrics","description":"Returns dedicated neutral-density (ND) filter telemetry including stops, effective stops, filter factor, optical density, transmittance percentage, and human-readable summary.","params":[],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"Current ND filter optical metrics."},{"status":404,"contentType":"application/json","description":"`optical-filter` component unavailable."}],"successExampleJson":"{\n  \"ok\" : true,\n  \"component\" : \"optical-filter\",\n  \"revision\" : 2,\n  \"enabled\" : true,\n  \"preset\" : \"ND8\",\n  \"stops\" : 3.0,\n  \"effectiveStops\" : 3.0,\n  \"factor\" : 8.0,\n  \"opticalDensity\" : 0.903,\n  \"transmittance\" : 0.125,\n  \"transmittancePercent\" : 12.5,\n  \"summary\" : \"ND8 (-3.0 EV)\"\n}"},{"operationId":"postNdFilter","method":"POST","path":"/api/nd","tag":"Optics & Filters","summary":"Configure ND filter stops or preset","description":"Shorthand endpoint for setting the neutral-density filter by preset (`preset`/`ndPreset`), explicit EV stops (`stops`/`ndStops` in `0.0..10.0`), `enabled`, or `off: true`.","params":[],"requestContentType":"application/json","requestFields":[{"name":"off","type":"boolean","required":false,"description":"Set to `true` to clear ND filter to `OFF` (0 stops)."},{"name":"preset","type":"string","required":false,"description":"ND preset name (e.g. `ND2`, `ND4`, `ND8`, `ND64`, `ND1000`, `VND`)."},{"name":"ndPreset","type":"string","required":false,"description":"Alias for `preset`."},{"name":"stops","type":"number","required":false,"description":"ND density in EV stops (`0.0..10.0`)."},{"name":"ndStops","type":"number","required":false,"description":"Alias for `stops`."},{"name":"enabled","type":"boolean","required":false,"description":"Enable or bypass optical filter processing."}],"requestExampleJson":"{\n  \"preset\" : \"ND8\"\n}","responses":[{"status":200,"contentType":"application/json","description":"Updated ND filter metrics."},{"status":400,"contentType":"application/json","description":"Missing parameters, unknown preset, or out-of-range stops."},{"status":404,"contentType":"application/json","description":"`optical-filter` component unavailable."}],"successExampleJson":"{\n  \"ok\" : true,\n  \"component\" : \"optical-filter\",\n  \"revision\" : 3,\n  \"enabled\" : true,\n  \"preset\" : \"ND8\",\n  \"stops\" : 3.0,\n  \"effectiveStops\" : 3.0\n}"},{"operationId":"getLanguage","method":"GET","path":"/api/lang","tag":"UI & Personalization","summary":"Get active UI language and supported locales","description":"Returns the current desktop studio UI locale and list of supported language codes.","params":[],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"Current UI locale state."}],"successExampleJson":"{\n  \"language\" : \"en\",\n  \"supported\" : [ \"en\", \"zh_CN\", \"ja_JP\", \"de_DE\", \"fr_FR\", \"es_ES\" ]\n}"},{"operationId":"postLanguage","method":"POST","path":"/api/lang","tag":"UI & Personalization","summary":"Switch desktop UI language live","description":"Hot-switches the emulator desktop UI language without restarting. Provide exact key `language` or `lang`.","params":[],"requestContentType":"application/json","requestFields":[{"name":"language","type":"string","required":false,"description":"Target locale code (`en`, `zh_CN`, `ja_JP`, `de_DE`, `fr_FR`, `es_ES`). Provide either `language` or `lang`."},{"name":"lang","type":"string","required":false,"description":"Alias for `language`."}],"requestExampleJson":"{\n  \"language\" : \"zh_CN\"\n}","responses":[{"status":200,"contentType":"application/json","description":"Language updated."},{"status":400,"contentType":"application/json","description":"Missing exact key or unsupported locale."}],"successExampleJson":"{\n  \"ok\" : true,\n  \"language\" : \"zh_CN\",\n  \"supported\" : [ \"en\", \"zh_CN\", \"ja_JP\", \"de_DE\", \"fr_FR\", \"es_ES\" ]\n}"},{"operationId":"getTheme","method":"GET","path":"/api/theme","tag":"UI & Personalization","summary":"Get active camera body and UI studio theme","description":"Returns the currently active camera body theme (`body`) and desktop studio UI theme (`ui`), plus available presets.","params":[],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"Current theme configuration."},{"status":404,"contentType":"application/json","description":"Theme controller unavailable (headless mode)."}],"successExampleJson":"{\n  \"body\" : \"graphite\",\n  \"ui\" : \"studio-dark\"\n}"},{"operationId":"postTheme","method":"POST","path":"/api/theme","tag":"UI & Personalization","summary":"Switch camera body and/or studio UI theme","description":"Hot-switches the camera body finish (`body`) and/or desktop studio UI theme (`ui`). Accepts a non-empty subset of `body` and `ui` with non-blank string values.","params":[],"requestContentType":"application/json","requestFields":[{"name":"body","type":"string","required":false,"description":"Camera body theme identifier."},{"name":"ui","type":"string","required":false,"description":"Desktop studio UI theme identifier."}],"requestExampleJson":"{\n  \"body\" : \"graphite\",\n  \"ui\" : \"studio-dark\"\n}","responses":[{"status":200,"contentType":"application/json","description":"Theme updated."},{"status":400,"contentType":"application/json","description":"Empty body, unknown key, or blank theme string."},{"status":404,"contentType":"application/json","description":"Theme controller unavailable (headless mode)."}],"successExampleJson":"{\n  \"ok\" : true,\n  \"body\" : \"graphite\",\n  \"ui\" : \"studio-dark\"\n}"},{"operationId":"postThemeReload","method":"POST","path":"/api/theme/reload","tag":"UI & Personalization","summary":"Hot-reload external camera body and UI themes","description":"Rescans `./themes/body/` and `./themes/ui/` packs from disk, re-resolves the active camera body and UI themes, and notifies all live studio windows without restarting.","params":[],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"Themes reloaded."},{"status":400,"contentType":"application/json","description":"Non-empty request body."},{"status":404,"contentType":"application/json","description":"Theme reload unavailable (headless mode)."}],"successExampleJson":"{\n  \"reloaded\" : true,\n  \"reloadGeneration\" : 1,\n  \"body\" : \"origin\",\n  \"ui\" : \"origin\"\n}"},{"operationId":"getFlashStatus","method":"GET","path":"/api/flash","tag":"NOR Flash","summary":"Get unified 64 MiB QSPI NOR Flash status","description":"Returns the active 64 MiB QSPI NOR Flash image path, boot path (`flash-direct` or `bootrom-nor`), BootROM presence, SHA-256 digest, writability, and committed erase/program counters.","params":[],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"Current unified NOR Flash status."},{"status":404,"contentType":"application/json","description":"Flash controller unavailable."}],"successExampleJson":"{\n  \"unifiedNorMode\" : true,\n  \"norFlashFile\" : \"flash/nor-flash.bin\",\n  \"factoryAvailable\" : true,\n  \"bootPath\" : \"flash-direct\",\n  \"bootRomPresent\" : true,\n  \"loaded\" : true,\n  \"length\" : 67108864,\n  \"writable\" : true,\n  \"eraseCommitted\" : 0,\n  \"programCommitted\" : 0\n}"},{"operationId":"postFlashAction","method":"POST","path":"/api/flash","tag":"NOR Flash","summary":"Flash .DAT firmware, export/import raw NOR image, or restore factory Flash","description":"Performs a live host flasher action against the unified 64 MiB QSPI NOR Flash image (`write-dat`, `export`, `import`, or `restore-factory`). Mutating actions automatically reload the component host and cold-reboot the camera.","params":[],"requestContentType":"application/json","requestFields":[{"name":"action","type":"string","required":true,"description":"Flash operation to perform."},{"name":"path","type":"string","required":false,"description":"Source or destination file path (required for `write-dat`, `export`, and `import`; resolved relative to emulator home if not absolute)."},{"name":"preserveCalibration","type":"boolean","required":false,"description":"For `write-dat` only: preserve calibration and user settings `[0x02FE0000..0x04000000)` (default `true`)."}],"requestExampleJson":"{\n  \"action\" : \"write-dat\",\n  \"path\" : \"GXUP0004.DAT\",\n  \"preserveCalibration\" : true\n}","responses":[{"status":200,"contentType":"application/json","description":"Flash action succeeded."},{"status":400,"contentType":"application/json","description":"Invalid action, missing path, or unknown field."},{"status":404,"contentType":"application/json","description":"Flash controller unavailable."}],"successExampleJson":"{\n  \"ok\" : true,\n  \"sizeBytes\" : 67108864,\n  \"preservedCalibration\" : true\n}"},{"operationId":"getOpenApiSpec","method":"GET","path":"/api/openapi.json","tag":"Documentation","summary":"Get OpenAPI 3.1.0 specification","description":"Serves the deterministically generated OpenAPI 3.1.0 JSON schema describing every route on this ControlServer, ready for Swagger UI, Postman, Apifox, Bruno, Insomnia, or Redoc.","params":[],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"application/json","description":"OpenAPI 3.1.0 JSON document."}],"successExampleJson":"{\n  \"openapi\" : \"3.1.0\",\n  \"info\" : {\n    \"title\" : \"FUJIFILM GFX100S Emulator HTTP Control API\",\n    \"version\" : \"1.0.0\"\n  }\n}"},{"operationId":"getApiDocsHtml","method":"GET","path":"/api/docs","tag":"Documentation","summary":"Open offline interactive HTTP API Explorer","description":"Serves a zero-CDN, self-contained HTML interactive API explorer with instant search, tag filtering, copy-as-curl snippets, and live same-origin Try-It execution against this ControlServer.","params":[],"requestContentType":null,"requestFields":[],"requestExampleJson":null,"responses":[{"status":200,"contentType":"text/html; charset=utf-8","description":"Self-contained interactive HTML API Explorer."}],"successExampleJson":null}]}</script>
<script>
(function () {
  const spec = JSON.parse(document.getElementById("api-spec-data").textContent);
  const baseUrlInput = document.getElementById("baseUrl");
  const searchInput = document.getElementById("search");
  const tagsEl = document.getElementById("tags");
  const statsEl = document.getElementById("stats");
  const listEl = document.getElementById("list");
  let activeTag = "ALL";

  if (window.location && (window.location.protocol === "http:" || window.location.protocol === "https:")) {
    baseUrlInput.value = window.location.origin;
  } else {
    baseUrlInput.value = spec.defaultBaseUrl;
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function getBaseUrl() {
    return (baseUrlInput.value || spec.defaultBaseUrl).replace(/\/+$/, "");
  }

  function buildUrl(ep, card) {
    let p = ep.path;
    const queryParts = [];
    for (const prm of ep.params || []) {
      const inp = card ? card.querySelector('[data-param="' + prm.name + '"]') : null;
      const val = inp ? inp.value.trim() : (prm.location === "path" ? (prm.example || "") : "");
      if (prm.location === "path") {
        p = p.replace("{" + prm.name + "}", encodeURIComponent(val || prm.example || "example"));
      } else if (val) {
        queryParts.push(encodeURIComponent(prm.name) + "=" + encodeURIComponent(val));
      }
    }
    return getBaseUrl() + p + (queryParts.length ? "?" + queryParts.join("&") : "");
  }

  function buildCurl(ep, card) {
    const url = buildUrl(ep, card);
    if (ep.method === "GET") return 'curl -s "' + url + '"';
    const ta = card ? card.querySelector(".try-body") : null;
    const rawBody = ta ? ta.value.trim() : (ep.requestExampleJson || "");
    if (!rawBody) return 'curl -s -X ' + ep.method + ' "' + url + '"';
    let compact = rawBody;
    try { compact = JSON.stringify(JSON.parse(rawBody)); } catch (_) {}
    return 'curl -s -X ' + ep.method + ' "' + url + '" \\\n  -H "Content-Type: application/json" \\\n  -d \'' + compact.replace(/'/g, "'\\''") + "'";
  }

  function renderTags() {
    const counts = { ALL: spec.endpoints.length };
    for (const ep of spec.endpoints) counts[ep.tag] = (counts[ep.tag] || 0) + 1;
    const items = [{ name: "ALL", label: "All (" + counts.ALL + ")" }].concat(
      spec.tags.map(t => ({ name: t.name, label: t.name + " (" + (counts[t.name] || 0) + ")" }))
    );
    tagsEl.innerHTML = items.map(it =>
      '<button type="button" class="tag-btn' + (activeTag === it.name ? " active" : "") + '" data-tag="' + esc(it.name) + '">' + esc(it.label) + "</button>"
    ).join("");
    tagsEl.querySelectorAll(".tag-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeTag = btn.getAttribute("data-tag");
        renderTags();
        renderList();
      });
    });
  }

  function matchesQuery(ep, q) {
    if (!q) return true;
    const hay = [
      ep.method, ep.path, ep.tag, ep.summary, ep.description, ep.operationId,
      ...(ep.params || []).map(p => p.name + " " + p.description),
      ...(ep.requestFields || []).map(f => f.name + " " + f.description)
    ].join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function renderList() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = spec.endpoints.filter(ep => (activeTag === "ALL" || ep.tag === activeTag) && matchesQuery(ep, q));
    statsEl.textContent = "Showing " + filtered.length + " of " + spec.endpoints.length + " endpoints";
    const byTag = new Map();
    for (const ep of filtered) {
      if (!byTag.has(ep.tag)) byTag.set(ep.tag, []);
      byTag.get(ep.tag).push(ep);
    }
    listEl.innerHTML = "";
    for (const tagMeta of spec.tags) {
      const eps = byTag.get(tagMeta.name);
      if (!eps || !eps.length) continue;
      const h = document.createElement("h2");
      h.className = "group-title";
      h.textContent = tagMeta.name;
      listEl.appendChild(h);
      const d = document.createElement("p");
      d.className = "group-desc";
      d.textContent = tagMeta.description;
      listEl.appendChild(d);
      for (const ep of eps) {
        listEl.appendChild(renderCard(ep));
      }
    }
  }

  function renderCard(ep) {
    const card = document.createElement("div");
    card.className = "card";
    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML =
      '<span class="badge ' + esc(ep.method) + '">' + esc(ep.method) + "</span>" +
      '<span class="ep-path">' + esc(ep.path) + "</span>" +
      '<span class="ep-summary">' + esc(ep.summary) + "</span>";
    head.addEventListener("click", () => card.classList.toggle("open"));
    card.appendChild(head);

    const body = document.createElement("div");
    body.className = "card-body";
    let html = '<p class="ep-desc">' + esc(ep.description) + "</p>";

    if (ep.params && ep.params.length) {
      html += '<div class="section-label">Parameters</div><table><thead><tr><th>Name</th><th>In</th><th>Type</th><th>Req</th><th>Description</th></tr></thead><tbody>';
      for (const p of ep.params) {
        html += "<tr><td><code>" + esc(p.name) + "</code></td><td><code>" + esc(p.location) + "</code></td><td><code>" + esc(p.type) + "</code></td><td>" + (p.required ? "yes" : "no") + "</td><td>" + esc(p.description) + "</td></tr>";
      }
      html += "</tbody></table>";
    }

    if (ep.requestFields && ep.requestFields.length) {
      html += '<div class="section-label">Request Body (' + esc(ep.requestContentType || "application/json") + ')</div><table><thead><tr><th>Field</th><th>Type</th><th>Req</th><th>Description</th></tr></thead><tbody>';
      for (const f of ep.requestFields) {
        html += "<tr><td><code>" + esc(f.name) + "</code></td><td><code>" + esc(f.type) + "</code></td><td>" + (f.required ? "yes" : "no") + "</td><td>" + esc(f.description) + "</td></tr>";
      }
      html += "</tbody></table>";
    }

    html += '<div class="section-label">Responses</div><table><thead><tr><th>Status</th><th>Content-Type</th><th>Description</th></tr></thead><tbody>';
    for (const r of ep.responses) {
      html += "<tr><td><code>" + esc(r.status) + "</code></td><td><code>" + esc(r.contentType) + "</code></td><td>" + esc(r.description) + "</td></tr>";
    }
    html += "</tbody></table>";

    if (ep.successExampleJson) {
      html += '<div class="section-label">Success Example</div><pre>' + esc(ep.successExampleJson) + "</pre>";
    }

    html += '<div class="try-box"><div class="section-label" style="margin-top:0">Try It &amp; curl</div>';
    if (ep.params && ep.params.length) {
      html += '<div class="try-row">';
      for (const p of ep.params) {
        const defVal = p.location === "path" ? (p.example || "") : "";
        html += '<label>' + esc(p.name) + ' <input type="text" data-param="' + esc(p.name) + '" value="' + esc(defVal) + '" placeholder="' + esc(p.example || p.type) + '"></label>';
      }
      html += "</div>";
    }
    if (ep.method !== "GET") {
      html += '<textarea class="try-body" spellcheck="false">' + esc(ep.requestExampleJson || "") + "</textarea>";
    }
    html += '<div class="try-actions">' +
      '<button type="button" class="primary btn-send">Send Request</button>' +
      '<button type="button" class="btn-curl">Copy curl</button>' +
      '<span class="status-pill hidden"></span>' +
      "</div>" +
      '<pre class="curl-preview"></pre>' +
      '<pre class="try-response hidden"></pre>' +
      "</div>";

    body.innerHTML = html;
    card.appendChild(body);

    const curlPreview = body.querySelector(".curl-preview");
    const statusPill = body.querySelector(".status-pill");
    const respPre = body.querySelector(".try-response");
    const updateCurl = () => { curlPreview.textContent = buildCurl(ep, card); };
    updateCurl();
    body.querySelectorAll("input, textarea").forEach(el => el.addEventListener("input", updateCurl));
    baseUrlInput.addEventListener("input", updateCurl);

    body.querySelector(".btn-curl").addEventListener("click", () => {
      const cmd = buildCurl(ep, card);
      curlPreview.textContent = cmd;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cmd).catch(() => {});
      }
    });

    body.querySelector(".btn-send").addEventListener("click", async () => {
      const url = buildUrl(ep, card);
      const opts = { method: ep.method, headers: {} };
      const ta = body.querySelector(".try-body");
      if (ep.method !== "GET" && ta && ta.value.trim()) {
        opts.headers["Content-Type"] = "application/json";
        opts.body = ta.value;
      } else if (ep.method !== "GET" && ep.requestContentType) {
        opts.headers["Content-Type"] = ep.requestContentType;
      }
      const t0 = performance.now();
      statusPill.className = "status-pill";
      statusPill.textContent = "Sending...";
      respPre.classList.remove("hidden");
      try {
        const res = await fetch(url, opts);
        const dt = Math.round(performance.now() - t0);
        const text = await res.text();
        statusPill.className = "status-pill " + (res.ok ? "status-ok" : "status-err");
        statusPill.textContent = "HTTP " + res.status + " (" + dt + " ms)";
        try {
          respPre.textContent = JSON.stringify(JSON.parse(text), null, 2);
        } catch (_) {
          respPre.textContent = text;
        }
      } catch (err) {
        statusPill.className = "status-pill status-err";
        statusPill.textContent = "Network Error";
        respPre.textContent = String(err) + "\n(Open via http://127.0.0.1:<port>/api/docs for live Try-It.)";
      }
    });

    return card;
  }

  searchInput.addEventListener("input", renderList);
  document.getElementById("expandAll").addEventListener("click", () => {
    listEl.querySelectorAll(".card").forEach(c => c.classList.add("open"));
  });
  document.getElementById("collapseAll").addEventListener("click", () => {
    listEl.querySelectorAll(".card").forEach(c => c.classList.remove("open"));
  });

  renderTags();
  renderList();
})();
</script>
</body>
</html>
