    regionId: blank-ff-experiment
    relativeOffset: 0x000003e7
    hex: "f501"
    confidence: HYPOTHESIS
    note: "电池 END ADC 关机阈值（501=0x01F5，约 5920 mV；既低于标称 7400 mV 的 626 与静态 power-peer 回退值 502 避免开机误关机，又在电量耗尽 5800 mV 时使 sel03=490 <= 501 真实触发固件 BATT_STS_END=0x06 自动关机）。"
  - id: bank14.bt_bd_addr
    regionId: blank-ff-experiment
    relativeOffset: 0x0000798a
    hex: "02464a100001"
    confidence: HYPOTHESIS
    note: "合成确定性本地管理（LAA）蓝牙 BD_ADDR（02:46:4A:10:00:01），与 Wi-Fi MAC 连续，不含真实个人机身数据。"
  - id: bank14.wireless_camera_name
