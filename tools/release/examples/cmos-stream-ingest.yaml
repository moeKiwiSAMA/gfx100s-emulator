# ==============================================================================
# CMOS 取景样例 3：本机回环低延迟推流取景模式（stream-ingest：TCP / HTTP / UDP）
#
# 使用方法：复制到 configs/components/cmos/cmos.yaml 生效。
# 说明：模拟器将在本机回环地址监听实时画面推流（仅限 127.0.0.1 / localhost，确保安全）：
#   - TCP 二进制帧 / HTTP POST /frame（自动识别）："tcp://127.0.0.1:9555" 或 "http://127.0.0.1:9555"
#   - UDP 数据报推流（FSUD 协议）                 ："udp://127.0.0.1:9555"
# 可配合 OBS / Python / 3D 渲染桥接脚本以 30/60fps 将画面实时注入虚拟 CMOS 传感器。
# ==============================================================================
sourceKind: "stream-ingest"
sourceFile: "tcp://127.0.0.1:9555"
loop: true
