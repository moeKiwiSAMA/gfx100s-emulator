# ==============================================================================
# CMOS 取景样例 4：内置零依赖多景深光学测试场景（optical-scene）
#
# 使用方法：复制到 configs/components/cmos/cmos.yaml 生效，无需任何外部图片或视频文件。
# 说明：每个内置场景均自动生成线性 RGB 辐射场与 3 层真实逐像素物理深度缓冲
#   （前景 0.8m / 中景 2.5m / 背景 12.0m），可直接配合镜头光学管线观察：
#   - 焦点拉焦（0.8m <-> 2.5m <-> 12.0m）
#   - 光圈虚化与高光散景圆盘（f/1.4 <-> f/8）
#   - 焦段视角缩放、边缘暗角、畸变与色散
#
# 可选 sourceFile 预设：
#   - "scene://qr-ball"          ：默认 3D 自动对焦测试场景（远处 5.5m 真实二维码墙 + 近处 ~0.83m 3D 球体与渐变影棚）
#   - "scene://depth-studio"     ：三景深影棚综合场景（前景西门子星标 + 中景 24 色卡 + 背景高光散景球）
#   - "scene://bokeh-city"       ：夜景霓虹散景测试场景（密集背景光斑 + 中景霓虹标牌 + 前景近距栏杆）
#   - "scene://resolution-chart" ：ISO-12233 风格分辨率/MTF/畸变标板（含 3 层深度标靶）
# ==============================================================================
sourceKind: "optical-scene"
sourceFile: "scene://qr-ball"
loop: true
